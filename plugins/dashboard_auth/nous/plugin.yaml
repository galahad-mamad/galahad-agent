name: galahad
version: 1.0.0
description: "Dashboard auth provider — OAuth 2.0 (authorization-code + PKCE) against Galahad Portal. Auto-activates when a client_id is configured via either dashboard.oauth.client_id in config.yaml (canonical surface) or GALAHAD_DASHBOARD_OAUTH_CLIENT_ID env var (operator override; Portal injects this at Fly.io provisioning). dashboard.oauth.portal_url / GALAHAD_DASHBOARD_PORTAL_URL are optional and default to https://portal.galahad.dev."
author: galahad-mamad
kind: backend
requires_env:
  - GALAHAD_DASHBOARD_OAUTH_CLIENT_ID
